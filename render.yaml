# Render Blueprint: Free Plan zum Ausprobieren.
# Achtung: Beim Free Plan gehen Konten und Nachrichten bei Neustart, Deploy und nach 15 Minuten ohne Zugriffe verloren.
# Für den Dauerbetrieb: plan auf 0.5c-512mb setzen und den disk Block unten einkommentieren (7,25 $/Monat).
services:
  - type: web
    name: team-chat
    runtime: node
    plan: free
    buildCommand: npm install
    startCommand: npm start
    healthCheckPath: /api/status
